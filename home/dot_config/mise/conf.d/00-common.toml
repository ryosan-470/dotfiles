# mise で入れる全マシン共通のツール (公開)。
# 優先順位は conf.d 内がファイル名の後ろ勝ち、~/.config/mise/config.toml (マシンローカル・管理外) が最優先。
# 同じツールを複数のファイルに書かないこと (docs/chezmoi.md の mise 節を参照)。
# 会社名や社内ツールを含むものは書かず、private の mise/config.toml か mise/config.<profile>.toml に置く。
[tools]
"aqua:tak848/ccgate" = "latest"
bun = "latest"
go = "1.27.3"
golangci-lint = "2.15.0"
node = "26"
npm = "12.2.2"
pnpm = "12.18.0"
uv = "latest"

# macOS のシステム設定 (Dock / Finder / キーリピート / トラックパッド)。
# `mise bootstrap --only macos-defaults` が差分だけ書く (run_onchange_after_tools-mise-defaults.sh.tmpl)。
# 注意:
# - 2026.11 時点では [bootstrap.macos.*] が有効な綴り。将来 [bootstrap.settings.macos.*] に移る予定なので、
#   そのときはこの節ごと書き換える (docs/chezmoi.md の mise 節)
# - 型が厳密に比較される。macOS が実数 (real) で保存しているキーは 2.0 のように実数で書くこと。
#   整数で書くと毎回差分扱いになり、apply のたびに書き換わる
[bootstrap.macos.defaults]
NSGlobalDomain = { KeyRepeat = 2.0, InitialKeyRepeat = 15.0, AppleShowAllExtensions = true }
"com.apple.dock" = { autohide = true, "show-recents" = false, tilesize = 64.0 }
"com.apple.finder" = { _FXSortFoldersFirst = true, FXPreferredViewStyle = "Nlsv" }

[bootstrap.macos.trackpad]
tap_to_click = true
