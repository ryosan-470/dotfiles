name: test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  apply:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.74.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: "chezmoi init --apply (私用マシン相当: workRepo は空)"
        run: chezmoi init --apply --no-tty --promptDefaults --source "$GITHUB_WORKSPACE"
      - name: Verify deployed files
        run: |
          set -eu
          for f in .zshrc .zshenv .gitconfig .tmux.conf \
                   .config/zsh/command.zsh .config/zsh/zimrc \
                   .config/git/commit_template.txt \
                   .claude/CLAUDE.md .claude/settings.json .claude/statusline.sh .claude/hooks/find-guard.sh \
                   .tmux/plugins/tpm/tpm; do
            test -e "$HOME/$f" || { echo "missing: $f"; exit 1; }
          done
          test ! -e "$HOME/.claude/settings.base.json"
          jq empty "$HOME/.claude/settings.json"
          chezmoi verify
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Syntax check zsh files
        run: |
          for f in "$HOME"/.zshrc "$HOME"/.zshenv "$HOME"/.config/zsh/*.zsh; do
            zsh -n "$f"
          done
      - name: Check deployed gitconfig parses
        run: git config --file "$HOME/.gitconfig" --list > /dev/null
      - name: Lint LaunchAgent plist
        if: runner.os == 'macOS'
        run: |
          set -eu
          plist="$RUNNER_TEMP/cleanup-caches.plist"
          chezmoi execute-template --source "$GITHUB_WORKSPACE" \
            < home/private_Library/private_LaunchAgents/com.ryosan470.cleanup-caches.plist.tmpl > "$plist"
          plutil -lint "$plist"
      - name: Check brew-bundle script renders
        if: runner.os == 'macOS'
        run: |
          set -eu
          script=home/.chezmoiscripts/run_onchange_after_brew-bundle.sh.tmpl
          chezmoi execute-template --source "$GITHUB_WORKSPACE" < "$script" > "$RUNNER_TEMP/brew-bundle.sh"
          test -s "$RUNNER_TEMP/brew-bundle.sh"
          bash -n "$RUNNER_TEMP/brew-bundle.sh"
      - name: "Verify Brewfile (インストールはせず、名前が解決できるかだけ確認)"
        if: runner.os == 'macOS'
        run: |
          set -eu
          brew bundle list --all --file=Brewfile
          for tap in $(brew bundle list --tap --file=Brewfile); do
            brew tap "$tap"
            # 未信頼 tap の formula/cask を読み込めない Homebrew 向け (trust コマンドが無ければ何もしない)
            if brew trust --help >/dev/null 2>&1; then brew trust "$tap"; fi
          done
          formulae=$(brew bundle list --formula --file=Brewfile)
          casks=$(brew bundle list --cask --file=Brewfile)
          # shellcheck disable=SC2086
          brew info --json=v2 --formula $formulae >/dev/null
          # shellcheck disable=SC2086
          brew info --json=v2 --cask $casks >/dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.74.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: shellcheck (テンプレートは展開してからチェック)
        run: |
          set -eu
          shellcheck -S warning \
            home/dot_claude/hooks/find-guard.sh \
            home/dot_claude/executable_statusline.sh \
            home/dot_local/bin/executable_cleanup-caches.sh \
            home/dot_tmux/executable_used-mem
          rendered="$RUNNER_TEMP/rendered"
          mkdir -p "$rendered"
          for f in home/dot_bashrc.tmpl home/dot_claude/modify_settings.json.tmpl home/.chezmoiscripts/*.tmpl; do
            out="$rendered/$(basename "$f").sh"
            chezmoi execute-template --source "$GITHUB_WORKSPACE" < "$f" > "$out"
            shellcheck -S warning -s bash "$out"
          done
      - name: actionlint
        run: pipx run actionlint-py==1.7.12.25
      - name: JSON schema (Claude Code settings)
        run: |
          pipx run check-jsonschema==0.33.3 \
            --schemafile https://json.schemastore.org/claude-code-settings.json \
            home/dot_claude/settings.base.json .claude/settings.json

  e2e:
    needs: apply
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.74.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install zsh / tmux (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: command -v tmux >/dev/null || brew install tmux
      - name: chezmoi init --apply
        run: chezmoi init --apply --no-tty --promptDefaults --source "$GITHUB_WORKSPACE"
      - name: E2E テスト (配置後にツールを実際に起動して検証)
        run: tests/e2e.sh
